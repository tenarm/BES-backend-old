[project]
name = "bes-factory"
version = "0.1.0"
description = "Modular BES Factory Monorepo"
requires-python = ">=3.10"
dependencies = [
    "sqlmodel",
    "fastapi",
    "uvicorn",
    "pydantic",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "greenlet>=3.5.0",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.27",
    "bcrypt<4.0.0",
    "jinja2"
]

[tool.pdm]
distribution = false

[tool.pdm.workspace]
packages = [
    "core",
    "extensions/*",
    "instances/*"
]


[dependency-groups]
dev = [
    "-e file:///${PROJECT_ROOT}/core",
    "-e file:///${PROJECT_ROOT}/extensions/settings",
    "-e file:///${PROJECT_ROOT}/extensions/sales",
    "-e file:///${PROJECT_ROOT}/extensions/inventory",
    "-e file:///${PROJECT_ROOT}/extensions/finance",
    "-e file:///${PROJECT_ROOT}/instances/msme_basic",
    "-e file:///${PROJECT_ROOT}/instances/msme_premium",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
]

[tool.pdm.scripts]
test = "pytest"
test-cov = "pytest --cov=core --cov=extensions --cov-report=term-missing"
test-core = "pytest core/tests"
test-extensions = "pytest extensions/"
test-instances = "pytest instances/"

[tool.pytest.ini_options]
norecursedirs = [
    "*.egg",
    ".git",
    ".venv",
    ".pdm-build",
    "scratch",
    "dist",
    "build"
]




