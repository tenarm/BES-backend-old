[project]
name = "acme-corp"
version = "0.1.0"
description = "Acme Corp Client Instance"
requires-python = ">=3.10"
dependencies = [
    "core",
    "sales",
    "finance"
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["acme_corp"]
