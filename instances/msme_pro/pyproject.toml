[project]
name = "msme-pro"
version = "0.1.0"
description = "msme pro Client Instance"
requires-python = ">=3.10"
dependencies = [
    "settings",
    "sales",
    "inventory",
    "supply_chain",
    "ai",
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["msme_pro"]
